services:
  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        INSIGHT_SITE_URL: https://insight.info
        INSIGHT_APP_URL: https://insight.info
        INSIGHT_HUB_URL: https://insight.info/hub
        INSIGHT_SINGLE_ORIGIN: 'true'
        INSIGHT_TOPO_URL: https://insight.info/topo.json
        INSIGHT_SOURCE_URL: https://github.com/maroofmandal/insight.info
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vemetric?schema=public
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: vemetric
      REDIS_URL: redis://redis:6379
    ports:
      - 127.0.0.1:3015:4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4000/']
      interval: 15s
      timeout: 5s
      retries: 10

  hub:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vemetric?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - 127.0.0.1:4004:4004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:4004/up']
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vemetric?schema=public
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: vemetric
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vemetric
    volumes:
      - insight_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vemetric']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - insight_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.8.4
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: vemetric
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - insight_clickhouse_data:/var/lib/clickhouse
      - insight_clickhouse_logs:/var/log/clickhouse-server
    ulimits:
      nproc: 65535
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8123/ping | grep -q Ok']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  insight_postgres_data:
  insight_redis_data:
  insight_clickhouse_data:
  insight_clickhouse_logs:
